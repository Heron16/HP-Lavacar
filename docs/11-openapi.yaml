openapi: 3.0.3
info:
  title: AquaWash API
  description: |
    API REST do sistema AquaWash — Agendamento de Lavagem de Veículos.
    
    **Autenticação:** Bearer JWT. Obtenha o token via `POST /api/auth/login`
    e inclua no header: `Authorization: Bearer <token>`
    
    **Perfis:**
    - `cliente` — acesso a próprios recursos
    - `admin` — acesso total
  version: 1.0.0
  contact:
    name: Equipe Lava - Car PH
    
servers:
  - url: http://localhost:3001
    description: Desenvolvimento local
  - url: https://meuapp.local
    description: Docker local (HTTPS)

tags:
  - name: Auth
    description: Autenticação e cadastro
  - name: Users
    description: Gerenciamento de usuários
  - name: Services
    description: Catálogo de serviços
  - name: Vehicles
    description: Veículos do cliente
  - name: Appointments
    description: Agendamentos de lavagem
  - name: Upload
    description: Upload de imagens
  - name: Health
    description: Saúde da aplicação

paths:

  # ─────────────────── AUTH ───────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login de usuário
      description: Autentica o usuário e retorna um JWT válido por 7 dias.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                  example: cliente@email.com
                senha:
                  type: string
                  example: Senha@123
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────── USERS ───────────────────
  /api/users/cadastrar:
    post:
      tags: [Users]
      summary: Cadastro de novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome:
                  type: string
                  example: João Silva
                email:
                  type: string
                  format: email
                  example: joao@email.com
                senha:
                  type: string
                  example: Senha@123
                  description: Mínimo 8 chars, maiúscula, minúscula, número e especial
                telefone:
                  type: string
                  example: "(41) 99999-0000"
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResumido'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/users:
    get:
      tags: [Users]
      summary: Listar todos os usuários (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Lista paginada de usuários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsuarios'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Buscar usuário por ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResumido'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Atualizar dados do usuário (próprio)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome:
                  type: string
                telefone:
                  type: string
                senha:
                  type: string
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResumido'
    delete:
      tags: [Users]
      summary: Excluir usuário (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Usuário excluído

  # ─────────────────── SERVICES ───────────────────
  /api/services:
    get:
      tags: [Services]
      summary: Listar serviços ativos (público)
      description: Retorna serviços ativos paginados. Não requer autenticação.
      parameters:
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Lista paginada de serviços ativos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServicos'
    post:
      tags: [Services]
      summary: Criar serviço (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicoInput'
      responses:
        '201':
          description: Serviço criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servico'

  /api/services/admin/todos:
    get:
      tags: [Services]
      summary: Listar todos os serviços (admin, inclui inativos)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Lista paginada de todos os serviços
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServicos'

  /api/services/{id}:
    put:
      tags: [Services]
      summary: Atualizar serviço (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicoInput'
      responses:
        '200':
          description: Serviço atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servico'
    delete:
      tags: [Services]
      summary: Excluir serviço (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Serviço excluído

  # ─────────────────── VEHICLES ───────────────────
  /api/vehicles/meus:
    get:
      tags: [Vehicles]
      summary: Listar veículos do cliente autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de veículos do cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Veiculo'

  /api/vehicles:
    get:
      tags: [Vehicles]
      summary: Listar todos os veículos (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de todos os veículos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Veiculo'
    post:
      tags: [Vehicles]
      summary: Cadastrar veículo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeiculoInput'
      responses:
        '201':
          description: Veículo cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Veiculo'

  /api/vehicles/{id}:
    put:
      tags: [Vehicles]
      summary: Atualizar veículo (próprio)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeiculoInput'
      responses:
        '200':
          description: Veículo atualizado
    delete:
      tags: [Vehicles]
      summary: Excluir veículo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Veículo excluído

  # ─────────────────── APPOINTMENTS ───────────────────
  /api/appointments/slots:
    get:
      tags: [Appointments]
      summary: Consultar slots disponíveis
      security:
        - bearerAuth: []
      parameters:
        - name: data
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-11-15"
        - name: servicoId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de horários disponíveis no formato YYYY-MM-DDTHH:mm
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: "2026-11-15T09:00"

  /api/appointments/meus:
    get:
      tags: [Appointments]
      summary: Listar agendamentos do cliente autenticado
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Lista paginada de agendamentos do cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgendamentos'

  /api/appointments:
    get:
      tags: [Appointments]
      summary: Listar todos os agendamentos (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Lista paginada de todos os agendamentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgendamentos'
    post:
      tags: [Appointments]
      summary: Criar agendamento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendamentoInput'
      responses:
        '201':
          description: Agendamento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agendamento'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/appointments/{id}/status:
    patch:
      tags: [Appointments]
      summary: Atualizar status do agendamento
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pendente, em_andamento, concluido, cancelado]
      responses:
        '200':
          description: Status atualizado
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/appointments/{id}:
    delete:
      tags: [Appointments]
      summary: Excluir agendamento
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Agendamento excluído

  # ─────────────────── HEALTH ───────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check do servidor
      responses:
        '200':
          description: Servidor funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                  timestamp:
                    type: string
                    format: date-time

# ─────────────────── COMPONENTS ───────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    pagina:
      name: pagina
      in: query
      schema:
        type: integer
        default: 1
    limite:
      name: limite
      in: query
      schema:
        type: integer
        default: 10
        maximum: 50

  responses:
    BadRequest:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Unauthorized:
      description: Token não fornecido ou inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Forbidden:
      description: Sem permissão para acessar este recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

  schemas:
    Erro:
      type: object
      properties:
        mensagem:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: '#/components/schemas/UsuarioResumido'

    UsuarioResumido:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
        perfil:
          type: string
          enum: [cliente, admin]
        telefone:
          type: string
          nullable: true
        fotoPerfil:
          type: string
          nullable: true

    Servico:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        descricao:
          type: string
        preco:
          type: number
          format: float
        duracao:
          type: integer
          description: Duração em minutos
        tiposVeiculo:
          type: array
          items:
            type: string
            enum: [carro, moto, caminhao, suv]
        ativo:
          type: boolean
        imagemUrl:
          type: string
          nullable: true

    ServicoInput:
      type: object
      required: [nome, descricao, preco, duracao, tiposVeiculo]
      properties:
        nome:
          type: string
        descricao:
          type: string
        preco:
          type: number
          minimum: 0.01
        duracao:
          type: integer
          minimum: 1
        tiposVeiculo:
          type: array
          items:
            type: string
            enum: [carro, moto, caminhao, suv]
        ativo:
          type: boolean
        imagemUrl:
          type: string
          nullable: true

    Veiculo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        marca:
          type: string
        modelo:
          type: string
        ano:
          type: integer
        placa:
          type: string
        cor:
          type: string
        tipo:
          type: string
          enum: [carro, moto, caminhao, suv]

    VeiculoInput:
      type: object
      required: [marca, modelo, ano, placa, cor, tipo]
      properties:
        marca:
          type: string
        modelo:
          type: string
        ano:
          type: integer
        placa:
          type: string
        cor:
          type: string
        tipo:
          type: string
          enum: [carro, moto, caminhao, suv]

    Agendamento:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        veiculoId:
          type: string
          format: uuid
        servicoId:
          type: string
          format: uuid
        agendadoPara:
          type: string
          format: date-time
        status:
          type: string
          enum: [pendente, em_andamento, concluido, cancelado]
        observacoes:
          type: string
          nullable: true
        precoTotal:
          type: number
        criadoEm:
          type: string
          format: date-time

    AgendamentoInput:
      type: object
      required: [veiculoId, servicoId, agendadoPara]
      properties:
        veiculoId:
          type: string
          format: uuid
        servicoId:
          type: string
          format: uuid
        agendadoPara:
          type: string
          format: date-time
          example: "2026-11-15T09:00:00.000Z"
        observacoes:
          type: string

    Paginacao:
      type: object
      properties:
        total:
          type: integer
        pagina:
          type: integer
        totalPaginas:
          type: integer

    PaginatedUsuarios:
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          properties:
            dados:
              type: array
              items:
                $ref: '#/components/schemas/UsuarioResumido'

    PaginatedServicos:
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          properties:
            dados:
              type: array
              items:
                $ref: '#/components/schemas/Servico'

    PaginatedAgendamentos:
      allOf:
        - $ref: '#/components/schemas/Paginacao'
        - type: object
          properties:
            dados:
              type: array
              items:
                $ref: '#/components/schemas/Agendamento'
